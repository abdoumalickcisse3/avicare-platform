# Dev profile.
#
# Host ports differ from doc 02 §3.14: Postgres defaults to 5434 and Redis
# to 6380 because the standard 5432/6379 are held by other services on the
# dev machine (see infra/docker-compose.yml header for the full story).
# Containers still expose 5432/6379 internally — only host mappings change.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:avicare}
    username: ${DB_USER:avicare}
    password: ${DB_PASSWORD:avicare_dev_pwd}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

avicare:
  features:
    # DEV-ONLY: disable subscription feature gating so endpoints work without
    # activating modules per farm (zero friction while building B2→C5). Default
    # is true (gating enforced); a boot guard refuses this under a prod profile.
    # See ADR-004. Re-enable for Phase C by removing this key.
    gating-enabled: false
  security:
    jwt:
      # DEV-ONLY throwaway RSA-2048 keypair so the app can mint/verify JWTs locally
      # out of the box. NEVER used in prod: the prod profile reads the keys from the
      # JWT_PRIVATE_KEY / JWT_PUBLIC_KEY env vars (see application.yml). Safe to commit.
