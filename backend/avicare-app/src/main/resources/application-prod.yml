# Prod profile — every secret and endpoint is supplied via environment variables
# (see infra/docker-compose.prod.yml and infra/DEPLOY.md). Never put real secrets
# in this file. Activated with SPRING_PROFILES_ACTIVE=prod.
#
# JWT RSA keys are read from JWT_PRIVATE_KEY / JWT_PUBLIC_KEY (declared in the base
# application.yml). In prod they MUST be provided — the app boots inert otherwise.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:avicare}
    username: ${DB_USER:avicare}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:15}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

avicare:
  features:
    # Subscription feature gating ENFORCED in prod (ADR-004: a boot guard refuses
    # gating-enabled=false under a prod profile).
    gating-enabled: true

app:
  cors:
    # Browser origins allowed to call the API. Every front that talks to /api must be listed:
    # the farmer dashboard (app), the partner portal (partner) and the staff console (admin).
    # They reach /api on their own host, but Caddy proxies to backend:8080 over plain http, so
    # Spring compares the Origin against that and sees every browser call as cross-origin —
    # a missing subdomain here is a 403 "Invalid CORS request" on login, and only in a browser
    # (curl without an Origin header sails through, which makes this easy to miss).
    # The apex/www are the landing. Override with CORS_ALLOWED_ORIGINS if the domain changes.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.jawdi.app,https://partner.jawdi.app,https://admin.jawdi.app,https://jawdi.app,https://www.jawdi.app}

logging:
  level:
    root: INFO
    com.avicare: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

# Notifications in prod: WhatsApp on (requires KONEKT_API_SECRET in the env), and the
# manual scan trigger disabled so /notifications/scan is not exposed in production.
notifications:
  whatsapp:
    enabled: ${NOTIF_WHATSAPP_ENABLED:true}
  scan:
    manual-trigger-enabled: false
