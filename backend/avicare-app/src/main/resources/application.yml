spring:
  application:
    name: avicare-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

avicare:
  security:
    jwt:
      issuer: ${JWT_ISSUER:avicare-platform}
      access-token-ttl: 15m
      # Sliding window: rotation renews the 30-day clock on every refresh, so an
      # active user never re-logs in; an idle one re-authenticates after 30 days.
      refresh-token-ttl: 30d
      # RSA keys are intentionally absent in dev: JwtService boots inert (logs a
      # WARN) until keys are provisioned (Sprint A3 / env vars in prod). The app
      # still starts so the security filter chain and public routes work.
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
