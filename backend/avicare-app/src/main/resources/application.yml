spring:
  application:
    name: avicare-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

avicare:
  # Platform back-office. The founder account is promoted to staff at startup and granted "*".
  # Never creates an account: the email must already be signed up. Unset = no promotion at all.
  admin:
    founder-email: ${ADMIN_FOUNDER_EMAIL:}
  security:
    jwt:
      issuer: ${JWT_ISSUER:avicare-platform}
      access-token-ttl: 15m
      # Sliding window: rotation renews the 30-day clock on every refresh, so an
      # active user never re-logs in; an idle one re-authenticates after 30 days.
      refresh-token-ttl: 30d
      # RSA keys are intentionally absent in dev: JwtService boots inert (logs a
      # WARN) until keys are provisioned (Sprint A3 / env vars in prod). The app
      # still starts so the security filter chain and public routes work.
      private-key: ${JWT_PRIVATE_KEY:}
      public-key: ${JWT_PUBLIC_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Jawdi IA — assistant LLM. `api-key` is intentionally NOT declared here: it is
# supplied only via the ANTHROPIC_API_KEY env var in prod (relaxed-binds to
# anthropic.api-key). When the env var is absent (dev, CI, tests) the property
# is missing, AnthropicLlmClient's @ConditionalOnProperty is false, and the
# deterministic MockLlmClient is used — so nothing here needs a secret.
anthropic:
  # The real LLM is off unless explicitly enabled AND given a key. `enabled=false`
  # (default) keeps the deterministic MockLlmClient — so an empty/missing key never
  # activates a broken client. api-key is supplied only via ANTHROPIC_API_KEY (prod).
  enabled: ${ANTHROPIC_ENABLED:false}
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:512}
  timeout-seconds: ${ANTHROPIC_TIMEOUT_SECONDS:12}

# Assistant usage guardrails. daily-quota caps the number of assistant requests
# one user may make per calendar day (UTC), counted from the assistant_audit
# trail — a cost guard before scaling. 0 or negative = unlimited.
assistant:
  daily-quota: ${ASSISTANT_DAILY_QUOTA:300}
  # Short-term conversational memory: replay the user's last N read answers (from
  # the audit trail) within the window, so a follow-up question keeps its subject.
  # memory-turns 0 disables it.
  memory-turns: ${ASSISTANT_MEMORY_TURNS:3}
  memory-window-minutes: ${ASSISTANT_MEMORY_WINDOW_MINUTES:15}
  # Server-side confirm claims (additional path): how long a claim stays confirmable,
  # and how often the sweep clears expired ones.
  confirm-ttl-minutes: ${ASSISTANT_CONFIRM_TTL_MINUTES:5}
  confirm-sweep-ms: ${ASSISTANT_CONFIRM_SWEEP_MS:300000}

# Konekt WhatsApp gateway (notifications channel). The secret is supplied ONLY via
# KONEKT_API_SECRET (prod) — never committed. WhatsApp is off unless enabled AND
# a secret is present; the dispatcher no-ops otherwise (in-app notifications keep working).
konekt:
  base-url: ${KONEKT_BASE_URL:https://konekt.nexteranga.com}
  api-secret: ${KONEKT_API_SECRET:}

# Notification scan (daily materialization) and WhatsApp dispatch cadence.
notifications:
  whatsapp:
    enabled: ${NOTIF_WHATSAPP_ENABLED:false}
    dispatch-cron: ${NOTIF_WHATSAPP_DISPATCH_CRON:0 */2 * * * *}
    max-attempts: ${NOTIF_WHATSAPP_MAX_ATTEMPTS:5}
    default-country-code: ${NOTIF_WHATSAPP_DEFAULT_CC:221}
  scan:
    cron: ${NOTIF_SCAN_CRON:0 0 6 * * *}
    zone: ${NOTIF_SCAN_ZONE:Africa/Dakar}
    manual-trigger-enabled: ${NOTIF_SCAN_MANUAL_TRIGGER:true}

# Partner network health (couche « Garder »): how long a member farm may stay silent before its
# partner is told. Platform-level thresholds — a farm has no say in when its own silence is flagged.
# The scan runs after the farmer notification scan so both read a settled day.
partner:
  risk:
    watch-days: ${PARTNER_RISK_WATCH_DAYS:7}
    at-risk-days: ${PARTNER_RISK_AT_RISK_DAYS:14}
    critical-days: ${PARTNER_RISK_CRITICAL_DAYS:30}
    scan-cron: ${PARTNER_RISK_SCAN_CRON:0 30 6 * * *}
    zone: ${PARTNER_RISK_SCAN_ZONE:Africa/Dakar}
