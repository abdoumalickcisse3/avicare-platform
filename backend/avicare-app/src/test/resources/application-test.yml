# Test profile for security wiring tests.
#
# The security integration test only needs the web layer + Spring Security +
# actuator. We exclude the persistence stack (datasource, JPA, Flyway, Redis)
# so the context boots without Postgres/Redis running — keeping the test fast,
# hermetic and CI-friendly (no Docker/Testcontainers required).
#
# Spring Boot 4 moved every autoconfiguration into its own module package and
# renamed several of them. An exclusion that no longer resolves is silently
# ignored, so a stale name here does not fail the build — it starts the whole
# persistence stack and the context dies on "Failed to determine a suitable
# driver class". Any Boot upgrade must re-check these seven names.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
  flyway:
    enabled: false
