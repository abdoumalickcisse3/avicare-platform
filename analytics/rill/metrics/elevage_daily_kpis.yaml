type: metrics_view
display_name: "Élevage — Séries journalières"
description: |
  Daily time-series view for mortality and feed consumption per production unit.
  Enables period-scoped KPI queries (today / 7d / 30d / mtd) used in the
  dashboard. Mirrors LivestockFacade period methods (Phase 2).

model: elevage_daily
timeseries: record_date
smallest_time_grain: day

dimensions:
  - name: record_date
    display_name: "Date"
    column: record_date

  - name: farm_id
    display_name: "Farm"
    column: farm_id

  - name: species
    display_name: "Espèce"
    column: species

  - name: unit_name
    display_name: "Lot"
    column: unit_name

  - name: production_unit_id
    display_name: "ID Lot"
    column: production_unit_id

measures:
  - name: total_mortality
    display_name: "Mortalité (période)"
    description: "Deaths in the selected period. Maps to mortalityCount in DashboardResponse."
    expression: SUM(mortality_count)
    format_preset: humanize
    lower_is_better: true

  - name: avg_daily_mortality
    display_name: "Mortalité moyenne/jour"
    expression: AVG(mortality_count)
    format_d3: ".1f"
    valid_percent_of_total: false
    lower_is_better: true

  - name: total_feed_kg
    display_name: "Aliment consommé (kg)"
    description: "Feed consumed in the selected period."
    expression: SUM(feed_kg)
    format_d3: ",.1f"

  - name: total_water_l
    display_name: "Eau consommée (L)"
    expression: SUM(water_l)
    format_d3: ",.1f"

  - name: avg_mortality_rate_pct
    display_name: "Taux mortalité moyen (%)"
    expression: AVG(daily_mortality_rate_pct)
    format_d3: ".3f"
    valid_percent_of_total: false
    lower_is_better: true
