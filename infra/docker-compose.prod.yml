# =====================================================================
# Jawdi Platform — PRODUCTION stack (single VPS, docker-compose).
#   caddy (80/443, auto-HTTPS)  ->  web (Next.js) + backend (Spring Boot)
#   backend -> postgres + redis (internal network only, no host ports)
#
# Run via ./deploy.sh (it sources .env and injects the JWT PEM keys).
# See infra/DEPLOY.md for the full runbook.
# =====================================================================

name: avicare-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-avicare}
      POSTGRES_USER: ${DB_USER:-avicare}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-avicare} -d ${DB_NAME:-avicare}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-avicare}
      DB_USER: ${DB_USER:-avicare}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_ISSUER: ${JWT_ISSUER:-avicare-platform}
      # Every browser front that calls /api, derived from DOMAIN (already required by caddy).
      # The full list is the fallback, not a bare ${CORS_ALLOWED_ORIGINS}: Docker turns an unset
      # variable into an empty string, and Spring would take that empty value over its own
      # default — locking every browser out of the API.
      # Where backup-db.sh writes its nightly dumps, as the container sees them. Read-only and
      # informational: the console reports the freshness of the last dump, it never writes here.
      BACKUP_DIR_MOUNTED: /var/backups/avicare
      # Whether an offsite remote is configured for rclone. Says configured, not "last upload
      # succeeded" — the container cannot see the remote, and claiming otherwise would be worse
      # than saying nothing.
      BACKUP_REMOTE_CONFIGURED: ${BACKUP_REMOTE:+true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.${DOMAIN},https://partner.${DOMAIN},https://admin.${DOMAIN},https://${DOMAIN},https://www.${DOMAIN}}
      # Promoted to platform staff at startup and granted "*". Never creates an account: the email
      # must already be signed up. Unset = nobody can enter the console, which is the safe default.
      ADMIN_FOUNDER_EMAIL: ${ADMIN_FOUNDER_EMAIL:-}
      # Where urgent platform alerts go: a module cut by the kill switch, a cut lifted or expired,
      # a CRITICAL integrity finding. Unset = those alerts are still audited but reach nobody, and
      # the backend says so at startup. Takes the same WhatsApp rail as everything else.
      ADMIN_ONCALL_PHONE: ${ADMIN_ONCALL_PHONE:-}
      # Contact de secours (P6) : prévenu si Malick n'a pas été vu sur la console depuis 72 h.
      # Ce n'est PAS le numéro d'astreinte ci-dessus — celui-ci est le sien.
      ADMIN_EMERGENCY_PHONE: ${ADMIN_EMERGENCY_PHONE:-}
      CONTINUITY_ENABLED: ${CONTINUITY_ENABLED:-true}
      CONTINUITY_SILENCE_HOURS: ${CONTINUITY_SILENCE_HOURS:-72}
      # WhatsApp (Konekt). Required for the self-service password reset AND the partner alerts.
      # Disabled by default: with no key, the reset flow answers normally but no code goes out.
      NOTIF_WHATSAPP_ENABLED: ${NOTIF_WHATSAPP_ENABLED:-false}
      KONEKT_API_SECRET: ${KONEKT_API_SECRET:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?export JWT_PRIVATE_KEY (deploy.sh does this)}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?export JWT_PUBLIC_KEY (deploy.sh does this)}
      # Jawdi IA — set ANTHROPIC_ENABLED=true and ANTHROPIC_API_KEY in .env to use the
      # real LLM; left as-is (disabled) the assistant runs the offline keyword Mock.
      ANTHROPIC_ENABLED: ${ANTHROPIC_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Interrupteurs des mécanismes plateforme eux-mêmes. Tous actifs par défaut ; ils sont ici
      # pour qu'on puisse en couper un depuis .env en cas de problème, sans rebuild ni redéploiement
      # — c'est précisément la situation que le kill switch existe pour éviter.
      #   TRACING_ENABLED=false   → plus d'écriture dans request_traces (le X-Correlation-Id,
      #                             les logs et le traceId des erreurs continuent de fonctionner)
      #   FLAGS_ENABLED=false     → plus aucune coupure appliquée (le gating par ferme est intact)
      #   INTEGRITY_ENABLED=false → plus de balayage nocturne des contrôles d'intégrité
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      FLAGS_ENABLED: ${FLAGS_ENABLED:-true}
      INTEGRITY_ENABLED: ${INTEGRITY_ENABLED:-true}
      #   RATE_LIMIT_ENABLED=false → plus de plafond de requêtes par adresse
      #   IP_BLOCKING_ENABLED=false → les adresses bloquées repassent (le journal continue)
      # Les seuils de force brute se règlent sans redéploiement si un vrai éleveur se fait attraper.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      IP_BLOCKING_ENABLED: ${IP_BLOCKING_ENABLED:-true}
      BRUTEFORCE_MAX_FAILURES: ${BRUTEFORCE_MAX_FAILURES:-5}
      BRUTEFORCE_BLOCK_MINUTES: ${BRUTEFORCE_BLOCK_MINUTES:-60}
      # --- Traçage distribué ---
      # Variable À PART, jamais fusionnée dans JAVA_OPTS : redéfinir JAVA_OPTS écraserait
      # MaxRAMPercentage et UseContainerSupport, et la JVM cesserait de respecter mem_limit.
      # La vider suffit à revenir au comportement d'avant, sans reconstruire l'image.
      TRACING_JAVA_OPTS: ${TRACING_JAVA_OPTS:--javaagent:/opt/otel/opentelemetry-javaagent.jar}
      OTEL_SERVICE_NAME: jawdi-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # Traces seules : les métriques et les logs OTLP doubleraient le coût mémoire pour
      # répondre à une autre question que celle qu'on se pose.
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      # 5 % du trafic normal : le mobile interroge l'API en boucle, tracer 100 % remplirait
      # Jaeger de GET à 40 ms. Les erreurs restent capturées par request_traces.
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_SAMPLE_RATIO:-0.05}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    volumes:
      # Read-only, and read-only on purpose: the console reports how fresh the last dump is, and
      # a backup directory an application can write to is one an application can also destroy.
      - ${BACKUP_DIR:-/home/deploy/avicare-backups}:/var/backups/avicare:ro
    mem_limit: ${BACKEND_MEM:-3g}
    networks: [internal]

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    networks: [internal]

  landing:
    image: ${LANDING_IMAGE:?set LANDING_IMAGE in .env}
    restart: unless-stopped
    networks: [internal]

  # Prépare le volume de Jaeger avant qu'il démarre. L'image tourne en uid 10001 et ne peut pas
  # créer /badger/data et /badger/key : la racine d'un volume Docker neuf appartient à root.
  # Un conteneur éphémère le fait, plutôt que de faire tourner Jaeger en root pour contourner.
  jaeger-init:
    image: busybox:1.37
    command: sh -c "mkdir -p /badger/data /badger/key && chown -R 10001:10001 /badger"
    volumes:
      - jaeger_data:/badger
    networks: [internal]

  # Traçage distribué. Son interface n'a AUCUNE authentification native : elle n'est jamais
  # publiée directement, seulement à travers Caddy, qui exige un mot de passe.
  jaeger:
    # Tag complet (1.62.0) : « 1.62 » n'existe pas sur Docker Hub, seuls 1.60 et 1 sont des
    # raccourcis. Version épinglée — une image qui change toute seule est une image qu'on ne
    # peut pas déboguer.
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    environment:
      # Sur disque plutôt qu'en mémoire : la mémoire perd tout au redémarrage et grossit sans
      # plafond, ce qui sur cette machine ne se discute pas.
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
      # Sept jours : une trace de performance sert à diagnostiquer un problème présent.
      # request_traces garde 30 jours et reste la table à chercher pour un appel de support.
      BADGER_SPAN_STORE_TTL: 168h
      COLLECTOR_OTLP_ENABLED: "true"
    volumes:
      - jaeger_data:/badger
    # Aucun `ports:` — ni le collecteur ni l'interface ne sortent du réseau interne. Un
    # collecteur ouvert sur Internet accepte les traces de n'importe qui.
    expose:
      - "4317"
      - "16686"
    # Sans limite, un conteneur qui dérape affame Postgres.
    mem_limit: ${JAEGER_MEM:-512m}
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - landing
      - backend
      - jaeger
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      # Interface Jaeger : identifiant et mot de passe HACHÉ (bcrypt), jamais en clair.
      JAEGER_UI_USER: ${JAEGER_UI_USER:-admin}
      JAEGER_UI_PASSWORD_HASH: ${JAEGER_UI_PASSWORD_HASH:?set JAEGER_UI_PASSWORD_HASH in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  jaeger_data:

networks:
  internal:
