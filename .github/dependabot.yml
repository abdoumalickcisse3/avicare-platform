version: 2

# Weekly update PRs. Minor and patch bumps are grouped into one PR per ecosystem to keep the noise
# down; a major bump arrives as its own PR so it gets reviewed on its own. Every PR runs the same
# CI as any other (Backend CI, Web CI, Mobile CI).
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Both majors are blocked by plugins that eslint-config-next bundles, not by our code:
      # typescript-eslint refuses TS 7 ("does not support TS 7.0"), and eslint-plugin-react still
      # calls context.getFilename(), removed in ESLint 10. Nothing to fix on our side — retry when
      # eslint-config-next ships updated plugins, by lifting the entry and running `npm run lint`.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /landing
    schedule:
      interval: weekly
    groups:
      landing-minor-patch:
        update-types: [minor, patch]

  # On a managed Expo project the SDK, not npm, decides the version of every expo-* package and of
  # react-native and its companions. `npx expo install --check` says what is actually behind;
  # `--fix` applies it. A Dependabot bump past the SDK fails with an ERESOLVE peer mismatch (#394)
  # or quietly installs a package built for the next SDK (#396, expo-router 58 under SDK 57).
  # These entries stop that noise; the way to move them is to move the SDK.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      mobile-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: expo
      - dependency-name: expo-*
      - dependency-name: react-native
      - dependency-name: react-native-*
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: babel-preset-expo
      - dependency-name: jest-expo
      - dependency-name: "@expo/*"
      - dependency-name: "@expo-google-fonts/*"
      - dependency-name: "@react-native/*"

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
