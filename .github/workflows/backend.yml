name: Backend CI

on:
  push:
    branches: [main, develop]
  # No `branches:` filter on purpose: a stacked PR targets another feature branch, and filtering
  # by base left those PRs with no checks at all — which is how #242 reached main unverified and
  # then closed itself when its base was deleted at merge.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Backend build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: avicare_test
          POSTGRES_USER: avicare
          POSTGRES_PASSWORD: test_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check formatting (Spotless)
        working-directory: ./backend
        run: ./mvnw -B spotless:check

      - name: Build, unit tests & integration tests (Testcontainers)
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: avicare_test
          DB_USER: avicare
          DB_PASSWORD: test_pwd
        # `verify` runs surefire (*Test) AND failsafe (*IT, via Testcontainers —
        # Docker is available on ubuntu-latest). Before B4-8 CI ran only `test`,
        # so the *IT never executed.
        run: ./mvnw -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/

  journey:
    name: API journey
    runs-on: ubuntu-latest
    # A separate job from the build on purpose: this one starts the packaged application and walks
    # it over HTTP. It catches what unit tests structurally cannot — a status that only goes wrong
    # once a real request crosses the filter chain, the controller and the database together. Every
    # assertion in the script comes from a defect that shipped.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: avicare_journey
          POSTGRES_USER: avicare
          POSTGRES_PASSWORD: test_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package the application
        working-directory: ./backend
        run: ./mvnw -B -DskipTests package -pl avicare-app -am

      - name: Start the application
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: avicare_journey
          DB_USER: avicare
          DB_PASSWORD: test_pwd
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          JAR=$(find avicare-app/target -maxdepth 1 -name 'avicare-app-*.jar' | head -1)
          echo "Starting $JAR"
          nohup java -jar "$JAR" > "${RUNNER_TEMP}/app.log" 2>&1 &
          disown
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "Application up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Application never became healthy:"; tail -100 "${RUNNER_TEMP}/app.log"; exit 1

      - name: Replay a farmer's first day
        run: python3 scripts/api-journey.py --base-url http://localhost:8080

      - name: Upload application log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journey-app-log
          path: ${{ runner.temp }}/app.log
