name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Backend build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: avicare_test
          POSTGRES_USER: avicare
          POSTGRES_PASSWORD: test_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check formatting (Spotless)
        working-directory: ./backend
        run: ./mvnw -B spotless:check

      - name: Build, unit tests & integration tests (Testcontainers)
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: avicare_test
          DB_USER: avicare
          DB_PASSWORD: test_pwd
        # `verify` runs surefire (*Test) AND failsafe (*IT, via Testcontainers —
        # Docker is available on ubuntu-latest). Before B4-8 CI ran only `test`,
        # so the *IT never executed.
        run: ./mvnw -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
