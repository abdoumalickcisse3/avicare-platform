name: Mobile CI

on:
  push:
    branches: [main, develop]
  # No `branches:` filter on purpose: a stacked PR targets another feature branch, and filtering
  # by base left those PRs with no checks at all — which is how #242 reached main unverified and
  # then closed itself when its base was deleted at merge.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Lint
        working-directory: ./mobile
        run: npm run lint || true

      - name: Type check
        working-directory: ./mobile
        run: npx tsc --noEmit

      - name: Test
        working-directory: ./mobile
        run: npm test -- --ci
