name: Deploy

# Builds the backend + web images, pushes them to GHCR, then SSHes into the
# VPS to pull and restart the stack. Manual by default; flip the `push` trigger
# on once you trust the pipeline.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the main-only and green-CI gate (emergency hotfix only)"
        type: boolean
        default: false
  # push:
  #   branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/avicare-backend
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/avicare-web
  LANDING_IMAGE: ghcr.io/${{ github.repository_owner }}/avicare-landing

jobs:
  # main has no server-side branch protection (free private plan, ADR-002), so this job is the only
  # guard: it refuses to ship a branch other than main, or a commit whose CI is not fully green.
  gate:
    name: deploy-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require main and green CI
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "::warning::force=true — main-only and green-CI checks skipped."
            exit 0
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Refusing to deploy $REF. Run the workflow on main, or tick 'force' for a hotfix."
            exit 1
          fi
          runs="$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate \
            --jq '.check_runs[] | select(.name != "deploy-gate") | [.name, .status, (.conclusion // "-")] | @tsv')"
          echo "$runs"
          for required in "Backend build" "Web build"; do
            if ! printf '%s\n' "$runs" | cut -f1 | grep -qx "$required"; then
              echo "::error::No '$required' check found on $SHA — CI has not run on this commit."
              exit 1
            fi
          done
          bad="$(printf '%s\n' "$runs" | awk -F'\t' '$2 != "completed" || ($3 != "success" && $3 != "neutral" && $3 != "skipped")')"
          if [ -n "$bad" ]; then
            echo "::error::CI is not green on $SHA:"
            echo "$bad"
            exit 1
          fi

  build-push:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Landing bakes the public URLs at build time. Override via repo Variables
      # (Settings → Secrets and variables → Actions → Variables) if the domain
      # differs from the defaults below.
      - name: Build & push landing
        uses: docker/build-push-action@v7
        with:
          context: ./landing
          file: ./landing/Dockerfile
          push: true
          # Phase collaborateurs : "Commencer gratuitement" mène à la page
          # /contact (pas au signup direct). Email + téléphone = coordonnées de
          # l'équipe. Réversible : repointer SIGNUP sur .../signup pour rouvrir
          # l'inscription en self-service.
          build-args: |
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL || 'https://jawdi.app' }}
            PUBLIC_APP_SIGNUP_URL=${{ vars.PUBLIC_APP_SIGNUP_URL || '/contact' }}
            PUBLIC_APP_LOGIN_URL=${{ vars.PUBLIC_APP_LOGIN_URL || 'https://app.jawdi.app/login' }}
            PUBLIC_PARTNER_EMAIL=${{ vars.PUBLIC_PARTNER_EMAIL || 'malick.cisse@nlogicsolutions.com' }}
            PUBLIC_CONTACT_PHONE=${{ vars.PUBLIC_CONTACT_PHONE || '+221 70 475 69 96' }}
            PUBLIC_GA_ID=${{ vars.PUBLIC_GA_ID }}
          tags: |
            ${{ env.LANDING_IMAGE }}:latest
            ${{ env.LANDING_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # deploy.sh waits up to 3 min for a healthy backend (twice if it has to roll back).
          command_timeout: 15m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_DIR }}
            git pull --ff-only
            cd infra
            ./deploy.sh ${{ github.sha }}

      # Second opinion from outside the box: what a farmer's phone would see through Caddy.
      - name: Verify public health
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://app.jawdi.app/actuator/health | grep -q '"status":"UP"'; then
              echo "Public health is UP."
              exit 0
            fi
            echo "Not UP yet (attempt $i/12)…"
            sleep 10
          done
          echo "::error::https://app.jawdi.app/actuator/health is not UP after deploy."
          exit 1
