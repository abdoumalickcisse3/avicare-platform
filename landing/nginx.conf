# Static server for the Astro vitrine (directory-format output: each route is
# a folder with an index.html). try_files resolves /route -> /route/ -> index.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Baseline hardening. HSTS is deliberately absent: TLS terminates at Caddy, which sets it (and
    # replaces these same fields, so nothing is duplicated). add_header declared in a location
    # block REPLACES every server-level one, hence the repeat inside /_astro/.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Long cache for fingerprinted assets, short for HTML.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
