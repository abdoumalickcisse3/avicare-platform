# Static server for the Astro vitrine (directory-format output: each route is
# a folder with an index.html). try_files resolves /route -> /route/ -> index.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirections RELATIVES, et c'est important.
    #
    # Astro émet un dossier par route : /liens est donc servi par une
    # redirection 301 vers /liens/. Par défaut nginx la rend ABSOLUE, en la
    # construisant avec SON schéma à lui — « http », puisque TLS se termine
    # chez Caddy qui lui parle en clair. Un visiteur qui tape jawdi.app/liens
    # recevait donc « Location: http://jawdi.app/liens/ » : un aller-retour en
    # clair, rattrapé ensuite par la redirection HTTPS de Caddy.
    #
    # Deux coûts, et aucun n'est théorique ici : le chemin visité transite en
    # clair une fois, et le visiteur paie un aller-retour de plus — sur une
    # connexion 3G de brousse, celui qu'on cherche justement à ménager. C'est
    # vrai de toutes les pages, et surtout de /liens, l'adresse qui part dans
    # les bios et que personne ne tape avec sa barre oblique finale.
    #
    # `absolute_redirect off` fait émettre « Location: /liens/ » : le
    # navigateur garde le schéma et l'hôte d'origine, donc HTTPS.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Baseline hardening. HSTS is deliberately absent: TLS terminates at Caddy, which sets it (and
    # replaces these same fields, so nothing is duplicated). add_header declared in a location
    # block REPLACES every server-level one, hence the repeat inside /_astro/.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Long cache for fingerprinted assets, short for HTML.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
