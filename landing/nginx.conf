# Static server for the Astro vitrine (directory-format output: each route is
# a folder with an index.html). try_files resolves /route -> /route/ -> index.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Long cache for fingerprinted assets, short for HTML.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
